[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    storage.path  /fluent-bit/buffer/
    storage.sync  normal
    storage.checksum off
    storage.backlog.mem_limit 10M

# =============================================================================
# 1. INPUTS
# 各ポートで受信し、Lua スクリプトでパースする。
# in_syslog (Mode tcp/udp, Parser raw, source_address_key remote_addr) により
# 送信元 IP (remote_addr) を自動取得して record に付与する。
# =============================================================================

# Port 514: RFC 5424 / RFC 3164 (UDP & TCP)
[INPUT]
    Name                syslog
    Mode                udp
    Port                514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.rfc5424.udp
    storage.type        filesystem

[INPUT]
    Name                syslog
    Mode                tcp
    Port                514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.rfc5424.tcp
    storage.type        filesystem

# Port 2514: RFC 5424 octet-counted (TCP)
[INPUT]
    Name                syslog
    Mode                tcp
    Port                2514
    Format              octet_counting
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.octet
    storage.type        filesystem

# Port 3514: Cisco Devices (UDP & TCP)
[INPUT]
    Name                syslog
    Mode                udp
    Port                3514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.cisco.udp
    storage.type        filesystem

[INPUT]
    Name                syslog
    Mode                tcp
    Port                3514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.cisco.tcp
    storage.type        filesystem

# Port 4514: RFC 3164 / IXルーター等 (UDP & TCP)
[INPUT]
    Name                syslog
    Mode                udp
    Port                4514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.rfc3164.udp
    storage.type        filesystem

[INPUT]
    Name                syslog
    Mode                tcp
    Port                4514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.rfc3164.tcp
    storage.type        filesystem

# Port 5514: Fortigate (UDP & TCP)
[INPUT]
    Name                syslog
    Mode                udp
    Port                5514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.fortigate.udp
    storage.type        filesystem

[INPUT]
    Name                syslog
    Mode                tcp
    Port                5514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.fortigate.tcp
    storage.type        filesystem

# Port 5515: Palo Alto (PAN-OS) (UDP & TCP)
[INPUT]
    Name                syslog
    Mode                udp
    Port                5515
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.panos.udp
    storage.type        filesystem

[INPUT]
    Name                syslog
    Mode                tcp
    Port                5515
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.panos.tcp
    storage.type        filesystem

# Port 6514: JSON 構造化ログ (UDP & TCP)
[INPUT]
    Name                syslog
    Mode                udp
    Port                6514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.json.udp
    storage.type        filesystem

[INPUT]
    Name                syslog
    Mode                tcp
    Port                6514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.json.tcp
    storage.type        filesystem

# Port 7514: AlaxalA スイッチ (UDP & TCP)
[INPUT]
    Name                syslog
    Mode                udp
    Port                7514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.alaxala.udp
    storage.type        filesystem

[INPUT]
    Name                syslog
    Mode                tcp
    Port                7514
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.alaxala.tcp
    storage.type        filesystem

# Port 999: CEF ログ (TCP)
[INPUT]
    Name                syslog
    Mode                tcp
    Port                999
    Parser              raw
    source_address_key  remote_addr
    Tag                 syslog.cef.tcp
    storage.type        filesystem


# =============================================================================
# 2. FILTERS (Lua Script Transformations - ポートごとに分割)
# =============================================================================

# Port 514 / 2514 / 4514: RFC 5424 / RFC 3164 / YAMAHA RTX 共通パーサー
[FILTER]
    Name    lua
    Match   syslog.rfc5424.*
    script  /fluent-bit/scripts/syslog_standard.lua
    call    process

[FILTER]
    Name    lua
    Match   syslog.octet
    script  /fluent-bit/scripts/syslog_standard.lua
    call    process

# Port 4514: RFC 3164
[FILTER]
    Name    lua
    Match   syslog.rfc3164.*
    script  /fluent-bit/scripts/syslog_standard.lua
    call    process

# Port 3514: Cisco
[FILTER]
    Name    lua
    Match   syslog.cisco.*
    script  /fluent-bit/scripts/cisco.lua
    call    process

# Port 5514: Fortigate
[FILTER]
    Name    lua
    Match   syslog.fortigate.*
    script  /fluent-bit/scripts/fortigate.lua
    call    process

# Port 5515: Palo Alto (PAN-OS)
[FILTER]
    Name    lua
    Match   syslog.panos.*
    script  /fluent-bit/scripts/panos.lua
    call    process

# Port 7514: AlaxalA
[FILTER]
    Name    lua
    Match   syslog.alaxala.*
    script  /fluent-bit/scripts/alaxala.lua
    call    process

# Port 999: CEF
[FILTER]
    Name    lua
    Match   syslog.cef.*
    script  /fluent-bit/scripts/cef.lua
    call    process

# Port 6514: JSON
[FILTER]
    Name    lua
    Match   syslog.json.*
    script  /fluent-bit/scripts/json.lua
    call    process


# =============================================================================
# 3. OUTPUT (OpenObserve)
# =============================================================================

[OUTPUT]
    Name             http
    Match            *
    Host             OpenObserve
    Port             5080
    URI              /api/default/syslog-ng/_json
    Format           json
    HTTP_User        root@root.root
    HTTP_Passwd      root
    json_date_key    @timestamp
    json_date_format iso8601
    storage.total_limit_size 100M
