# ロギングの共通設定 (アンカー)
# /var/lib/docker/containers/<コンテナID>/<コンテナID>-local.log に保存
x-logging-def: &logging-def
  driver: "local"
  options:
    max-size: "100m"
    max-file: "10"

services:
  # https://openobserve.ai/docs/guide/quickstart/#self-hosted-installation
  # https://gallery.ecr.aws/zinclabs/openobserve
  OpenObserve:
    # simd は AVX512 に対応していないと (Xeon とか) 動作しない
    image: public.ecr.aws/zinclabs/openobserve:v1.0.0
    container_name: OpenObserve
    ports:
      - 5080:5080
    volumes:
      - ./openobserve/data/:/data/
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - ZO_DATA_DIR=${ZO_DATA_DIR:-/data}
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@root.root}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-root}
    user: '${UID:-1000}:${GID:-1000}'
    restart: unless-stopped
    logging: *logging-def

  # Fluent Bit (Fast and Lightweight Log Processor)
  # https://fluentbit.io/
  fluent-bit:
    image: fluent/fluent-bit:5.1.2
    container_name: fluent-bit
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ./fluent-bit/conf/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/conf/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./fluent-bit/scripts/:/fluent-bit/scripts/:ro
      - ./fluent-bit/buffer/:/fluent-bit/buffer/
    ports:
      - 514:514/tcp # 514/tcp RFC 5424 形式 改行区切り
      - 514:514/udp # 514/udp RFC 5424 形式
      - 2514:2514/tcp # 2514/tcp RFC 5424 形式 octet-counted 用
      - 3514:3514/tcp # 3514/tcp Cisco 用
      - 3514:3514/udp # 3514/udp Cisco 用
      - 4514:4514/tcp # 4514/tcp RFC 3164 形式 改行区切り
      - 4514:4514/udp # 4514/udp RFC 3164 形式
      - 5514:5514/tcp # 5514/tcp Fortigate 用
      - 5514:5514/udp # 5514/udp Fortigate 用
      - 5515:5515/tcp # 5515/tcp Palo Alto 用
      - 5515:5515/udp # 5515/udp Palo Alto 用
      - 6514:6514/tcp # 6514/tcp JSON 構造化ログ用
      - 6514:6514/udp # 6514/udp JSON 構造化ログ用
      - 7514:7514/tcp # 7514/tcp AlaxalA 用
      - 7514:7514/udp # 7514/udp AlaxalA 用
      - 999:999/tcp # 999/tcp CEF
    restart: unless-stopped
    logging: *logging-def

